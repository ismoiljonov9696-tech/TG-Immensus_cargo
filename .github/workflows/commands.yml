name: Buyruqlarni o'qish

# ============================================================
#  "Chiqarish (kuzatuvchi)" endi faqat kuniga bitta nashr vaqti
#  atrofida ishga tushadi. Shu oraliqda botga yozilgan /balans,
#  /holat, /pauza kabi buyruqlar ertangi ishga tushishgacha
#  javobsiz qolib ketardi.
#
#  Bu ish `tick` ni HECH QANDAY kutishsiz, bir marta chaqiradi —
#  faqat Telegram xabarlarini o'qib javob berish va (agar postning
#  chiqish vaqti allaqachon yetgan bo'lsa) uni chiqarish uchun.
#  Har 15 daqiqada ishlaydi, bir necha soniyada tugaydi.
# ============================================================
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  # "Chiqarish (kuzatuvchi)" bilan BIR XIL guruh — shu ikkalasi hech qachon
  # bir vaqtda ishlamasin (aks holda ikkalasi ham "chiqadi" deb topib,
  # postni ikki marta yuborishi mumkin edi). Kuzatuvchi band bo'lsa, bu ish
  # navbatda kutadi va u tugagach darhol ishga tushadi.
  group: chiqarish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Buyruqlarni o'qish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main tick

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name  "autopost-bot"
          git config user.email "autopost@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "buyruq/navbat $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
