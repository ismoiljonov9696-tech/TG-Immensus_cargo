name: Post tayyorlash

# ============================================================
#  KUNIGA 1 TA POST: 07:00 (Toshkent)
#
#  Post bir kun oldin KECHQURUN tayyorlanadi — ertalab emas.
#  Sabab: GitHub'ning cron'i aniq vaqtda ishlamaydi, u navbatga qo'yiladi
#  va odatda 30 daqiqadan 2 soatgacha kechikadi. Kechqurun tayyorlansa,
#  2 soat kechiksa ham ertalabki 07:00 gacha 9 soatdan ko'p vaqt qoladi.
#
#  20:00 da ertangi 07:00 uchun bitta post tayyorlanadi va navbatga qo'yiladi.
#  Uni "Tugmalar va chiqarish" workflow'i o'z vaqtida kanalga chiqaradi.
#
#  Vaqtlar UTC da. Toshkent = UTC+5.
# ============================================================
on:
  schedule:
    - cron: "0 15 * * *"       # 20:00 Toshkent — ASOSIY: ertangi 1 ta post
    - cron: "0 3 * * *"        # 08:00 Toshkent — ZAXIRA: yetishmasa to'ldiradi
  workflow_dispatch:
    inputs:
      count:
        description: "Nechta post tayyorlansin"
        type: string
        default: "1"
      force:
        description: "Sifat nazoratidan o'tmasa ham davom etsinmi"
        type: boolean
        default: false

concurrency:
  group: tayyorlash          # chiqarish ishidan alohida — bir-birini kutmasin
  cancel-in-progress: false

permissions:
  contents: write              # arxiv va navbatni commit qilish uchun

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45        # QC qayta yozishlar bo'lsa ham yetadi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Postlarni tayyorlash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON: ${{ github.event.schedule }}
          COUNT: ${{ inputs.count }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$CRON" = "0 15 * * *" ]; then
            # Kechqurun: ertangi kunning yagona postini tayyorlaymiz.
            FLAGS="--count 1"
            echo "Asosiy ishga tushish: 1 ta post tayyorlanadi"
          elif [ "$CRON" = "0 3 * * *" ]; then
            # Ertalab: navbatni tekshiramiz. 1 ta bo'lsa hech narsa qilmaydi,
            # bo'lmasa (kechqurungi urinish yiqilgan bo'lsa) tayyorlaydi.
            FLAGS="--top-up 1"
            echo "Zaxira ishga tushish: navbat 1 taga to'ldiriladi"
          else
            FLAGS="--count ${COUNT:-1}"
            echo "Qo'lda ishga tushirildi"
          fi
          if [ "$FORCE" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python -m src.main generate $FLAGS

      - name: Xato bo'lsa Telegramga xabar
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          # Zaxira xabarnoma: Python o'zi xabar yubora olmay qolgan holat uchun
          # (masalan kutubxona o'rnatilmadi yoki jarayon butunlay yiqildi).
          TEXT="⚠️ Post tayyorlash ishga tushmadi (GitHub Actions xatosi).
          Loglar: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            -d chat_id="${CHAT}" --data-urlencode text="${TEXT}" > /dev/null || true

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name  "autopost-bot"
          git config user.email "autopost@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "postlar tayyorlandi $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
