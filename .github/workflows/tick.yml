name: Tugmalar va chiqarish

# Tugma bosishlarini o'qiydi, qayta ishlashni bajaradi va vaqti kelgan
# postni kanalga chiqaradi.
#
# DIQQAT: GitHub cron'ining eng kichik oralig'i 5 daqiqa va u ko'pincha
# yana bir necha daqiqa kechikadi. 10 daqiqalik ko'rish oynasi uchun bu
# aniqlik yetarli emas — post 5-10 daqiqa kech chiqishi mumkin.
# Aniq vaqt kerak bo'lsa: server yoki kompyuterda src.scheduler ishlating
# (har 60 soniyada tekshiradi), yoki config.yaml da preview_minutes ni
# 30 daqiqaga oshiring.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kutubxonalar
        run: pip install -r requirements.txt

      - name: Tugmalarni o'qish va chiqarish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main tick

      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name  "autopost-bot"
          git config user.email "autopost@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && exit 0
          git commit -m "navbat yangilandi $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
